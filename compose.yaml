services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bip_gate
      POSTGRES_USER: gate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["gate_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate -d bip_gate"]
      interval: 3s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://gate:${POSTGRES_PASSWORD}@db:5432/bip_gate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      CORS_ORIGINS: http://localhost:8080
    ports: ["127.0.0.1:3220:3220"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  gate_db:
